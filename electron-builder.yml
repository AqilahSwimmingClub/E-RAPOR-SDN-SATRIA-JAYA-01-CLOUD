# Installer Windows e-Rapor.
#
# appId dan productName WAJIB tetap sama di setiap rilis. NSIS memakai appId untuk mengenali
# instalasi sebelumnya, sehingga installer versi baru memperbarui instalasi lama di tempat
# tanpa perlu uninstall. Mengganti salah satunya akan membuat Windows menganggapnya aplikasi
# berbeda sehingga terpasang dua kali dan data guru seolah hilang.
appId: id.sch.sdn.satriajaya01.erapor
# productName ikut menentukan folder instalasi dan nama .exe, jadi ia DIPERTAHANKAN demi
# instalasi lama. Nama yang dilihat pengguna diatur lewat shortcutName dan uninstallDisplayName.
productName: e-Rapor SDN Satria Jaya 01
copyright: Fahmi Djawas, S.Pd.

directories:
  output: release/windows
  buildResources: build

# Hanya berkas aplikasi yang dipaketkan. Data guru tidak pernah ikut ke folder instalasi.
files:
  - electron/**/*
  - dist/**/*
  - package.json
  - '!**/*.map'

asar: true

win:
  # IKON WINDOWS = IKON ANDROID.
  #
  # Sebelum v1.4.0 tidak ada baris ikon di sini sama sekali, sehingga electron-builder memakai
  # ikon bawaan Electron: aplikasi yang sama tampil sebagai e-Rapor di HP tetapi sebagai ikon
  # Electron generik di Desktop, Start Menu, dan taskbar.
  #
  # build/icon.ico dihasilkan scripts/generate-windows-icon.mjs dari
  # assets/android-icon-master.png - berkas yang sama yang dipakai membuat ikon launcher
  # Android - dan berisi tujuh resolusi (16..256) supaya tajam di setiap tempat Windows
  # menampilkannya. Isinya generik "e-Rapor", tanpa nama sekolah, karena aplikasi ini dijual
  # ke banyak sekolah.
  #
  # Mengganti IKON tidak mengganti IDENTITAS: appId, productName, guid NSIS, dan folder
  # %APPDATA% di berkas ini sengaja tidak disentuh, sehingga Windows tetap mengenali instalasi
  # v1.3.16 dan memperbaruinya di tempat tanpa kehilangan data guru.
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  # Nama berkas installer saja. appId, productName, dan guid di atas TIDAK ikut berubah,
  # sehingga Windows tetap mengenali instalasi lama dan memperbaruinya di tempat, dan
  # %APPDATA%/e-Rapor SDN Satria Jaya 01 tetap menjadi tempat data guru.
  artifactName: E-Rapor-SD-v${version}-Setup.${ext}
  # Tanpa signing: sesuai permintaan, tidak ada sertifikat yang dibuat pada tahap ini.
  signAndEditExecutable: false

nsis:
  # Upgrade di tempat: installer mendeteksi versi lama lewat appId lalu menimpanya.
  oneClick: true
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: false
  # AppData (%APPDATA%/e-Rapor SDN Satria Jaya 01) TIDAK PERNAH dihapus, termasuk saat uninstall,
  # sehingga data siswa, nilai, absensi, TP, bobot, mapping, dan profil guru selalu bertahan.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: e-Rapor
  # GUID dikunci agar kunci registri uninstall tetap sama antar versi. Inilah yang membuat
  # installer baru mengenali instalasi lama dan memperbaruinya, bukan memasang salinan kedua.
  guid: 9a3f0d21-6c4b-5e88-9d17-2f6a1b7c4e30
  uninstallDisplayName: e-Rapor
  differentialPackage: false
  # Ikon yang sama dipakai installer, uninstaller, dan entri Add/Remove Programs, sehingga
  # pengguna melihat wajah yang sama sejak memasang sampai membuka aplikasinya.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
