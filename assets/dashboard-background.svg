<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 945" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!--
    LATAR DASHBOARD - MURNI LATAR.

    Tidak ada logo, teks, peta, kartu, sidebar, menu, grafik, foto, maupun bayangan antarmuka
    apa pun di dalam berkas ini. Isinya hanya warna: gradasi mint ke tosca ke biru langit,
    sedikit cream terang di sudut kiri atas, awan yang sangat lembut, dan dedaunan buram di
    tepi bawah kiri dan kanan.

    BAGIAN TENGAH SENGAJA DIBIARKAN BERSIH. Di situlah kartu dashboard berdiri, dan latar yang
    ramai di tengah akan membuat angka dan tulisan sulit dibaca.
  -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#eaf7ec"/>
      <stop offset="0.18" stop-color="#c8f2ec"/>
      <stop offset="0.42" stop-color="#8fe6e6"/>
      <stop offset="0.68" stop-color="#5fd2ee"/>
      <stop offset="1" stop-color="#37b4f4"/>
    </linearGradient>
    <radialGradient id="cahaya" cx="0.08" cy="0.04" r="0.62">
      <stop offset="0" stop-color="#fffdf0" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#f2fbe9" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#eaf9f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tengah" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="buram" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="buramTebal" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="awan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1680" height="945" fill="url(#langit)"/>
  <rect width="1680" height="945" fill="url(#cahaya)"/>
  <rect width="1680" height="945" fill="url(#tengah)"/>

  <!-- Awan lembut, jauh dari tengah supaya tidak mengganggu keterbacaan konten. -->
  <g fill="#ffffff" filter="url(#awan)" opacity="0.75">
    <ellipse cx="1512" cy="196" rx="120" ry="52"/>
    <ellipse cx="1424" cy="214" rx="86" ry="38"/>
    <ellipse cx="1596" cy="222" rx="84" ry="34"/>
    <ellipse cx="1104" cy="176" rx="66" ry="24"/>
    <ellipse cx="1046" cy="188" rx="44" ry="18"/>
    <ellipse cx="176" cy="256" rx="98" ry="36"/>
    <ellipse cx="266" cy="272" rx="66" ry="26"/>
    <ellipse cx="1448" cy="618" rx="122" ry="44"/>
    <ellipse cx="1330" cy="642" rx="82" ry="30"/>
    <ellipse cx="1560" cy="640" rx="78" ry="28"/>
  </g>

  <!-- Dua sapuan tipis sebagai pemanis, bukan bentuk yang berdiri sendiri. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="26" stroke-linecap="round">
    <path d="M708 902 C 1010 806 1268 728 1680 660"/>
    <path d="M628 944 C 1000 862 1300 792 1680 748" stroke-opacity="0.14"/>
  </g>

  <!-- Dedaunan buram di tepi bawah kiri. -->
  <g filter="url(#buramTebal)" opacity="0.9">
    <g fill="#8ed46a">
      <ellipse cx="42" cy="612" rx="66" ry="38" transform="rotate(-24 42 612)"/>
      <ellipse cx="132" cy="672" rx="58" ry="32" transform="rotate(18 132 672)"/>
      <ellipse cx="24" cy="742" rx="72" ry="40" transform="rotate(-12 24 742)"/>
      <ellipse cx="182" cy="782" rx="64" ry="34" transform="rotate(26 182 782)"/>
      <ellipse cx="86" cy="856" rx="86" ry="44" transform="rotate(-8 86 856)"/>
      <ellipse cx="268" cy="878" rx="76" ry="38" transform="rotate(14 268 878)"/>
      <ellipse cx="392" cy="922" rx="88" ry="40" transform="rotate(-6 392 922)"/>
    </g>
    <g fill="#b6e88a" opacity="0.85">
      <ellipse cx="96" cy="648" rx="40" ry="22" transform="rotate(-30 96 648)"/>
      <ellipse cx="196" cy="726" rx="44" ry="24" transform="rotate(22 196 726)"/>
      <ellipse cx="46" cy="806" rx="48" ry="26" transform="rotate(-16 46 806)"/>
      <ellipse cx="318" cy="836" rx="46" ry="24" transform="rotate(10 318 836)"/>
    </g>
  </g>

  <!-- Dedaunan buram di tepi bawah kanan. -->
  <g filter="url(#buramTebal)" opacity="0.92">
    <g fill="#7ecb63">
      <ellipse cx="1648" cy="596" rx="72" ry="40" transform="rotate(20 1648 596)"/>
      <ellipse cx="1544" cy="664" rx="62" ry="34" transform="rotate(-18 1544 664)"/>
      <ellipse cx="1660" cy="726" rx="78" ry="42" transform="rotate(8 1660 726)"/>
      <ellipse cx="1486" cy="768" rx="66" ry="36" transform="rotate(-26 1486 768)"/>
      <ellipse cx="1604" cy="842" rx="90" ry="46" transform="rotate(12 1604 842)"/>
      <ellipse cx="1394" cy="884" rx="78" ry="38" transform="rotate(-10 1394 884)"/>
      <ellipse cx="1226" cy="930" rx="84" ry="38" transform="rotate(6 1226 930)"/>
    </g>
    <g fill="#a8e07e" opacity="0.85">
      <ellipse cx="1580" cy="626" rx="44" ry="24" transform="rotate(26 1580 626)"/>
      <ellipse cx="1478" cy="706" rx="42" ry="22" transform="rotate(-22 1478 706)"/>
      <ellipse cx="1646" cy="790" rx="50" ry="26" transform="rotate(14 1646 790)"/>
      <ellipse cx="1328" cy="906" rx="46" ry="24" transform="rotate(-8 1328 906)"/>
    </g>
  </g>

  <!-- Kabut tipis di kaki layar supaya dedaunan menyatu dengan langit, bukan menempel. -->
  <rect y="700" width="1680" height="245" fill="url(#tengah)" filter="url(#buram)" opacity="0.5"/>
</svg>
