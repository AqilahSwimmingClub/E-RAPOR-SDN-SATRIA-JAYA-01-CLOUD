name: Verifikasi Koding Fase C

on:
  push:
    branches:
      - work/cp-koding-fase-c

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test CP Koding
        run: node --test tests/koding-fase-c-resmi.test.js tests/cp-resmi-koding-mulok.test.js
