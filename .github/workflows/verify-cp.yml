name: Verifikasi CP SD

on:
  push:
    branches:
      - work/cp-sd-fase-abc

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Test CP resmi
        run: node --test tests/cp-resmi-koding-mulok.test.js
      - name: Test selain CP resmi
        run: |
          files=$(find tests -maxdepth 1 -name '*.test.js' ! -name 'cp-resmi-koding-mulok.test.js' -print | sort)
          node --test $files
